[workspace]
# EIM container backend: llama.cpp is gone. Deleted crates were icn-engine,
# icn-reasoning, icn-speculative, icn-parity, icn-parity-probe, and
# benchmark-runner (whose OpenAI SSE client moved into icn-eim).
#
# Excluded until stage 2, when each gets the surgery the plan describes:
#   icn-models  — drop gguf.rs/planner_stub.rs/preview.rs/identity.rs, retarget download.rs
#                 from single GGUF files to whole safetensors repositories
#   icn-catalog — rewrite around the EIM catalog importer; it still calls the deleted crates
# Stage 1 needs neither: every AppState collaborator is an optional `Arc<dyn Trait>` defined
# in icn-api, so a container-backed server compiles without any model inventory.
members = ["crates/icn-api", "crates/icn-contracts", "crates/icn-eim", "crates/icn-hardware", "crates/icn-server", "crates/icn-utils"]
exclude = ["crates/icn-catalog", "crates/icn-models"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.54", features = ["derive", "env"] }
encoding_rs = "0.8.35"
flate2 = "1.1"
futures-util = "0.3.31"
fs2 = "0.4.3"
getrandom = "0.4.3"
hf-hub = { version = "1.0.0", features = ["rustls-tls"] }
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
icn-api = { path = "crates/icn-api" }
icn-contracts = { path = "crates/icn-contracts" }
icn-eim = { path = "crates/icn-eim" }
icn-hardware = { path = "crates/icn-hardware", default-features = false }
# icn-models returns in stage 2 (see [workspace].exclude)
# icn-models = { path = "crates/icn-models" }
icn-utils = { path = "crates/icn-utils" }
libc = "0.2.180"
opentelemetry = { version = "0.32.0", features = ["logs", "trace"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-json", "logs", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.0", features = ["logs", "trace"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror = "2.0.17"
toml = "0.9.8"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1.18"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "preserve_order"] }
utoipa-axum = "0.2.0"
