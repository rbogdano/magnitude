[package]
name = "icn-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host memory policy and CPU-only hardware discovery for ICN"

# The `icn-model-assessment` binary was a front end for the llama.cpp `common/fit` planner.
# Fit estimation now lives in icn-eim, driven by catalog geometry rather than native planning.

[dependencies]
icn-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = { workspace = true, features = ["system"] }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus"] }
