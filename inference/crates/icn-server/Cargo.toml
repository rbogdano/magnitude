[package]
name = "icn-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ICN composition root: HTTP boundary over the EIM container backend"

[[bin]]
name = "magnitude-icn"
path = "src/main.rs"

# The GPU/Metal/Vulkan feature graph is gone with llama.cpp. A container-backed engine has one
# acceleration story — vLLM on Xeon inside the EIM image — and the daemon it talks to is
# discovered at runtime, not selected at compile time. `ash` and `libloading` went with the
# CUDA and Vulkan probes they existed for.

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
icn-api.workspace = true
icn-contracts.workspace = true
icn-eim.workspace = true
icn-hardware.workspace = true
libc.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process"] }
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3.24.0"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
